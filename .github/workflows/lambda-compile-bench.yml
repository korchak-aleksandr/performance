name: LambdaExpression.Compile benchmark (temporary, not for upstream)

on:
  push:
    branches: [lambda-compile-benchmark]
  workflow_dispatch:

jobs:
  bench:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: net9.0
            framework: net9.0
            runtimes: 9.0.x
            sdk_quality: ""
            roll_forward: ""
          - label: net10.0
            framework: net10.0
            runtimes: 10.0.x
            sdk_quality: ""
            roll_forward: ""
          - label: main (daily 12.0, with dotnet/runtime#135893)
            framework: net11.0
            runtimes: 12.0.x
            sdk_quality: daily
            roll_forward: LatestMajor
    steps:
      - uses: actions/checkout@v4

      # The daily 12.0 SDK satisfies global.json (rollForward: major) on its own.
      - name: Install SDK from global.json
        if: matrix.roll_forward == ''
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install runtime under test
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.runtimes }}
          dotnet-quality: ${{ matrix.sdk_quality }}

      - name: Show installed runtimes
        run: dotnet --list-runtimes

      - name: Run benchmark
        working-directory: src/benchmarks/micro
        env:
          ROLL_FORWARD: ${{ matrix.roll_forward }}
        run: |
          # net11.0 is the newest TFM MicroBenchmarks supports; roll it forward onto the 12.0 daily runtime.
          if [ -n "$ROLL_FORWARD" ]; then export DOTNET_ROLL_FORWARD="$ROLL_FORWARD"; fi
          dotnet run -c Release -f ${{ matrix.framework }} -- \
            --filter '*Perf_LambdaExpression*' \
            --artifacts ${{ github.workspace }}/bdn

      - name: Summary
        if: always()
        run: |
          echo "## ${{ matrix.label }}" >> "$GITHUB_STEP_SUMMARY"
          cat ${{ github.workspace }}/bdn/results/*-report-github.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bdn-${{ matrix.framework }}-${{ strategy.job-index }}
          path: bdn
